name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Fetch dependencies
        run: |
          # `moon install` without arguments is deprecated: the toolchain
          # resolves and downloads every dependency on the first build-ish
          # command, which is what the next step does anyway.
          moon update
      - name: Lint (check --deny-warn)
        run: moon check --deny-warn
      - name: Format check
        run: |
          # `moon fmt --check` errors out while the module has no packages, so
          # this gate arms itself as soon as the first moon.pkg lands.
          if find . -name 'moon.pkg' -not -path './_build/*' | grep -q .; then
            moon fmt --check
          else
            echo "no packages yet — skipping the format check"
          fi
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Package archive stays clean
        run: |
          # "Before pushing or publishing, read the archive contents with
          # `moon package --list`" is a hard rule; this makes it a gate.
          moon package --list 2>pkg-list.txt >/dev/null
          if grep -E '^(harness/|_build/|target/|\.|__pycache__/)' pkg-list.txt; then
            echo "::error::local-only paths leaked into the package archive"
            exit 1
          fi
          echo "package archive clean"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library promises identical behaviour on native, wasm-gc and js,
        # so all three backends are exercised.
        target:
          - wasm-gc
          - native
          - js
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: moon update
      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: moon update
      - name: Install Python judges
        run: python3 -m pip install -r harness/requirements.txt
      - name: Fixtures are reproducible
        run: python3 harness/make_refs.py --check
      - name: RLE cases are reproducible
        run: python3 harness/make_rle_cases.py --check
      - name: RLE byte diff
        run: python3 harness/check_rle.py
      - name: Dictionary cases are reproducible
        run: python3 harness/make_dict_cases.py --check
      - name: Dictionary byte diff
        run: python3 harness/check_dict.py
      - name: Delta cases are reproducible
        run: python3 harness/make_delta_cases.py --check
      - name: Delta byte diff
        run: python3 harness/check_delta.py
      - name: Byte stream split cases are reproducible
        run: python3 harness/make_bss_cases.py --check
      - name: Byte stream split byte diff
        run: python3 harness/check_bss.py
      - name: FSST round trip and scoreboard
        run: python3 harness/check_fsst.py
      - name: Roaring cases are reproducible
        run: python3 harness/make_roaring_cases.py --check
      - name: Roaring byte diff
        run: python3 harness/check_roaring.py
      - name: Container interop
        run: harness/check_container.sh
