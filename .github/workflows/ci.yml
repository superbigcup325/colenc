name: CI

on:
  push:
    branches:
      - main
      - 'codex/ci-*'
  pull_request:
  # Check the latest toolchain weekly without changing the version used on pushes.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONBIT_INSTALL_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '1.0.0-rc1+3c0520448' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain version
        run: |
          moon version --all
          if [ "$MOONBIT_INSTALL_VERSION" != latest ]; then
            moonc -v | grep -F "v$MOONBIT_INSTALL_VERSION ("
          fi
      - name: Fetch dependencies
        run: |
          # `moon install` without arguments is deprecated: the toolchain
          # resolves and downloads every dependency on the first build-ish
          # command, which is what the next step does anyway.
          moon update
      - name: Lint (check --deny-warn)
        run: moon check --deny-warn
      - name: Build library and example (wasm-gc)
        run: moon build --target wasm-gc --deny-warn . sketches examples/encode_demo
      - name: Format check
        run: |
          # `moon fmt --check` errors out while the module has no packages, so
          # this gate arms itself as soon as the first moon.pkg lands.
          if find . -name 'moon.pkg' -not -path './_build/*' | grep -q .; then
            moon fmt --check
          else
            echo "no packages yet — skipping the format check"
          fi
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Package archive stays clean
        run: |
          # "Before pushing or publishing, read the archive contents with
          # `moon package --list`" is a hard rule; this makes it a gate.
          moon package --list 2>pkg-list.txt >/dev/null
          if grep -E '^(harness/|_build/|target/|\.|__pycache__/)' pkg-list.txt; then
            echo "::error::local-only paths leaked into the package archive"
            exit 1
          fi
          echo "package archive clean"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library promises identical behaviour on native, wasm-gc and js,
        # so all three backends are exercised.
        target:
          - wasm-gc
          - native
          - js
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: moon update
      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: moon update
      # The judge *versions* are pinned, the interpreter is not, so the image's
      # default decides whether the pinned wheels exist. `datasketches` ships
      # none for cp314 and its source build does not compile on this image, so
      # pin the newest interpreter every pinned judge has a wheel for -- the
      # same 3.13 `harness/README.md` asks a local user to create.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install Python judges
        run: |
          python -VV
          # Wheel-only: a missing wheel must fail here, loudly, instead of
          # silently compiling a reference judge from source.
          python -m pip install --only-binary=:all: -r harness/requirements.txt
      - name: Fixtures are reproducible
        run: python3 harness/make_refs.py --check
      - name: RLE cases are reproducible
        run: python3 harness/make_rle_cases.py --check
      - name: RLE byte diff
        run: python3 harness/check_rle.py
      - name: Dictionary cases are reproducible
        run: python3 harness/make_dict_cases.py --check
      - name: Dictionary byte diff
        run: python3 harness/check_dict.py
      - name: Delta cases are reproducible
        run: python3 harness/make_delta_cases.py --check
      - name: Delta byte diff
        run: python3 harness/check_delta.py
      - name: Byte stream split cases are reproducible
        run: python3 harness/make_bss_cases.py --check
      - name: Byte stream split byte diff
        run: python3 harness/check_bss.py
      - name: FSST round trip and scoreboard
        run: python3 harness/check_fsst.py
      - name: Roaring cases are reproducible
        run: python3 harness/make_roaring_cases.py --check
      - name: Roaring byte diff
        run: python3 harness/check_roaring.py
      - name: Roaring sequences with no reference bytes
        run: python3 harness/check_roaring_ops.py
      - name: Container interop
        run: harness/check_container.sh
      - name: Sketch acceptance (HLL)
        run: python3 harness/check_hll.py
      - name: Sketch acceptance (t-digest)
        run: python3 harness/check_tdigest.py
      - name: Packaged surface
        run: python3 harness/check_consumer.py
